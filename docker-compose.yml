services:
  db:
    image: postgres:15-alpine
    container_name: rag_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-azera}
      POSTGRES_DB: ${DB_NAME:-Rag_it}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ml:/app/ml

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: rag_mlflow
    restart: always
    ports:
      - "5000:5000"
    command: mlflow ui --host 0.0.0.0 --port 5000
    volumes:
      - mlruns_data:/mlruns
      - ./ml:/app/ml

  app:
    build: .
    container_name: rag_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - db
      - mlflow
    volumes:
      - .:/app
      - ./ml:/app/ml

volumes:
  postgres_data:
  mlruns_data:
