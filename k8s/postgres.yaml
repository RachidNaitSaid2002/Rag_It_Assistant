apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-postgres
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-postgres
  template:
    metadata:
      labels:
        app: rag-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: rag_db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: rag-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rag-secrets
              key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: rag-postgres
  namespace: default
spec:
  selector:
    app: rag-postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
